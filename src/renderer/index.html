<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SeatChanger</title>
	<link rel="stylesheet" href="./styles/style.css">
</head>
<body>
	<main class="app-shell">
		<aside class="app-sidebar">
			<div class="app-title">SeatChanger V1.0.0</div>
			<nav class="tab-list" aria-label="main navigation">
				<button class="tab-button active" data-tab="dashboard">대시보드</button>
				<button class="tab-button" data-tab="classes">내 반</button>
				<button class="tab-button" data-tab="students">학생 목록</button>
				<button class="tab-button" data-tab="changer">자리바꾸기</button>
				<button class="tab-button" data-tab="gallery">갤러리</button>
				<button class="tab-button" data-tab="settings">설정</button>
			</nav>
			<div class="sidebar-footer" id="sidebarSummary">반 없음</div>
		</aside>

		<section class="app-main">
			<header class="topbar">
				<h1 id="pageTitle">대시보드</h1>
				<div class="topbar-right">
					<p id="message" class="message">반을 만들고 학생을 추가해.</p>
					<button class="changer-tool-button" id="goDashboardTopButton">대시보드</button>
					<button class="changer-tool-button" id="toggleChangerPanelButton">패널</button>
					<button class="hamburger-button" id="hamburgerButton" aria-label="자리바꾸기 메뉴">☰</button>
				</div>
			</header>

			<section class="page active" id="dashboardPage" data-page="dashboard">
				<div class="panel stats-panel">
					<h2>현재 상태</h2>
					<div class="stat-grid">
						<div><span>선택 반</span><strong id="dashClassName">없음</strong></div>
						<div><span>학생</span><strong id="dashStudentCount">0</strong></div>
						<div><span>좌석</span><strong id="dashSeatCount">0</strong></div>
					</div>
					<div class="stat-grid">
						<div><span>전체 반</span><strong id="dashClassCount">0</strong></div>
						<div><span>갤러리</span><strong id="dashGalleryCount">0</strong></div>
						<div><span>자동 저장</span><strong>ON</strong></div>
					</div>
					<button id="deleteClassButton">선택 반 삭제</button>
				</div>
			</section>

			<section class="page" id="classesPage" data-page="classes">
				<div class="panel">
					<div class="section-title">
						<h2>내 반</h2>
						<button class="primary" id="openClassModalButton">+ 새 반</button>
					</div>
					<div class="class-list" id="classList"></div>
				</div>
			</section>

			<section class="page" id="studentsPage" data-page="students">
				<div class="panel">
					<h2>학생 목록</h2>
					<div class="form-row">
						<select id="studentClassSelect"></select>
					</div>
					<div class="student-add-row">
						<span class="student-create-number" id="studentManagerDraftNumber">1</span>
						<span class="student-create-divider">|</span>
						<input id="studentManagerNameInput" type="text" placeholder="이름">
						<div class="student-create-gender" role="radiogroup" aria-label="성별">
							<label><input type="radio" name="student-manager-gender" value="남" checked><span>남</span></label>
							<label><input type="radio" name="student-manager-gender" value="여"><span>여</span></label>
						</div>
						<button id="addStudentManagerButton">추가</button>
					</div>
					<div class="student-create-list student-manager-list" id="studentManagerList"></div>
				</div>
			</section>

			<section class="page changer-page" id="changerPage" data-page="changer">
				<aside class="changer-sidebar">
					<div class="panel">
						<h2>반 선택</h2>
						<select id="changerClassSelect"></select>
					</div>
					<div class="panel">
						<h2>정보</h2>
						<div class="meta-list">
							<div><span>총 명수</span><strong id="changerStudentCount">0</strong></div>
							<div><span>좌석 수</span><strong id="changerSeatCount">0</strong></div>
						</div>
					</div>
					<div class="panel">
						<h2>좌석 설정</h2>
						<div class="action-stack">
							<div class="split">
								<label>
									<span>행</span>
									<input id="rowCountInput" type="number" min="1" max="12" step="1">
								</label>
								<label>
									<span>열</span>
									<input id="colCountInput" type="number" min="1" max="12" step="1">
								</label>
							</div>
							<button id="applyLayoutButton">행/열 적용</button>
							<button class="primary" id="shuffleButton">자리 섞기</button>
							<div class="split">
								<button id="addSeatButton">좌석 추가</button>
								<button id="deleteSeatButton">선택 삭제</button>
							</div>
							<div class="split">
								<button id="zoomOutButton">축소</button>
								<button id="zoomInButton">확대</button>
							</div>
							<div class="split">
								<button id="saveButton">저장</button>
								<button id="loadButton">불러오기</button>
							</div>
							<button id="resetZoomButton">100%</button>
						</div>
					</div>
				</aside>

				<section class="stage">
					<div class="classroom-grid" id="classroomGrid">
						<div class="front-marker">앞</div>
						<div class="seat-canvas" id="seatCanvas"></div>
					</div>
					<aside class="hamburger-panel" id="hamburgerPanel">
						<div class="panel">
							<div class="section-title">
								<h2>조건 설정</h2>
								<button id="closeHamburgerButton">닫기</button>
							</div>
							<label>
								<span>서로 붙으면 안 되는 짝</span>
								<textarea id="avoidPairsInput" spellcheck="false" placeholder="2:2:2 옆자리 기준&#10;김민준, 이서연&#10;박지후, 최하윤"></textarea>
							</label>
							<label>
								<span>서로 붙게 하고 싶은 짝</span>
								<textarea id="preferPairsInput" spellcheck="false" placeholder="2:2:2 옆자리 기준&#10;김민준, 박지후"></textarea>
							</label>
							<label>
								<span>어느 반경 안에 붙으면 안 되는 짝</span>
								<textarea id="radiusAvoidPairsInput" spellcheck="false" placeholder="김민준, 최하윤, 1&#10;이서연, 박지후, 2"></textarea>
							</label>
							<label>
								<span>성별 배치</span>
								<select id="genderPairModeSelect">
									<option value="none">사용 안 함</option>
									<option value="same">동성 배치</option>
									<option value="mixed">이성 배치</option>
								</select>
							</label>
							<button class="primary" id="saveConstraintsButton">조건 저장</button>
						</div>
					</aside>
				</section>
			</section>

			<section class="page" id="galleryPage" data-page="gallery">
				<div class="panel">
					<h2>갤러리 핀보드</h2>
					<div class="gallery-board" id="galleryBoard"></div>
				</div>
			</section>

			<section class="page" id="settingsPage" data-page="settings">
				<div class="panel">
					<h2>설정</h2>
					<label class="checkbox-row">
						<input id="flashAfterShuffleInput" type="checkbox">
						<span>섞은 뒤 플래시 효과</span>
					</label>
					<label class="checkbox-row">
						<input id="autoSaveGalleryInput" type="checkbox">
						<span>섞은 뒤 갤러리 자동 저장</span>
					</label>
					<p class="muted">색상: #1E1E1E / 포인트: 주황색 / 스냅: 20px</p>
				</div>
			</section>
		</section>

		<div class="capture-overlay" id="captureOverlay">
			<div class="capture-card">
				<div class="photo-card" id="photoPreview"></div>
				<div class="capture-actions">
					<p>갤러리에 저장할까요?</p>
					<div>
						<button class="primary" id="saveGalleryButton">저장</button>
						<button id="discardGalleryButton">닫기</button>
					</div>
				</div>
			</div>
		</div>

		<div class="viewer-overlay" id="viewerOverlay">
			<div class="viewer-card">
				<div class="viewer-topbar">
					<strong>갤러리 사진</strong>
					<div class="viewer-tools">
						<button id="viewerZoomOutButton">-</button>
						<button id="viewerZoomResetButton">100%</button>
						<button id="viewerZoomInButton">+</button>
						<button id="maximizeViewerButton">최대화</button>
						<button id="closeViewerButton">닫기</button>
					</div>
				</div>
				<div class="photo-card expanded" id="viewerPhoto"></div>
			</div>
		</div>

		<div class="class-modal-overlay" id="classModalOverlay">
			<div class="class-modal">
				<div class="section-title">
					<h2 id="classModalTitle">새 반</h2>
					<button id="closeClassModalButton">닫기</button>
				</div>
				<div class="class-modal-step active" id="classNameStep">
					<label>
						<span>반 이름</span>
						<input id="classModalNameInput" type="text" placeholder="예: 1반">
					</label>
				</div>
				<div class="class-modal-step" id="classStudentStep">
					<div class="student-add-row">
						<span class="student-create-number" id="studentDraftNumber">1</span>
						<span class="student-create-divider">|</span>
						<input id="studentDraftNameInput" type="text" placeholder="이름">
						<div class="student-create-gender" role="radiogroup" aria-label="성별">
							<label><input type="radio" name="student-draft-gender" value="남" checked><span>남</span></label>
							<label><input type="radio" name="student-draft-gender" value="여"><span>여</span></label>
						</div>
						<button id="addStudentDraftButton">추가</button>
					</div>
					<div class="student-create-list" id="classModalStudentList"></div>
				</div>
				<div class="modal-actions">
					<button id="backClassModalButton">이전</button>
					<button class="primary" id="nextClassModalButton">다음</button>
					<button class="primary" id="createClassModalButton">저장 후 나가기</button>
					<button id="cancelClassModalButton">취소</button>
				</div>
			</div>
		</div>
	</main>

	<script type="module" src="./scripts/app.js"></script>
</body>
</html>
